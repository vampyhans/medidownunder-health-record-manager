<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit patient — MediDownUnder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="js/data.js">
</script>
<script src="js/shell.js">
</script>
<script>  const s = requireAuth('receptionist');
  if(s){
    const id = qs('id');
    const patients = DB.patients();
    const p = patients.find(x=>x.id===id);

    if(!p){
      window.location.href = 'patients.html';
    } else {
      renderShell(s, 'search', `
        <a class="back-link" href="patient-detail.html?id=${id}">&larr; Back to record</a>
        <div class="card">
          <h2>Edit patient details</h2>
          <p class="desc mono">${p.id}</p>
          <form id="editForm" novalidate>
            <div class="field-grid">
              <div class="field" id="f_name"><label>Full name</label><input id="p_name" value="${esc(p.name)}"><div class="field-error">Enter the patient's full name.</div></div>
              <div class="field" id="f_dob"><label>Date of birth</label><input id="p_dob" type="date" value="${p.dob}"><div class="field-error">Enter a date of birth.</div></div>
              <div class="field" id="f_contact"><label>Contact number</label><input id="p_contact" value="${esc(p.contact)}"><div class="field-error">Enter a valid contact number.</div></div>
              <div class="field" id="f_address"><label>Address</label><input id="p_address" value="${esc(p.address)}"><div class="field-error">Enter an address.</div></div>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:6px;">Save changes</button>
          </form>
        </div>`);

      document.getElementById('editForm').addEventListener('submit', e=>{
        e.preventDefault();
        const name = document.getElementById('p_name').value.trim();
        const dob = document.getElementById('p_dob').value;
        const contact = document.getElementById('p_contact').value.trim();
        const address = document.getElementById('p_address').value.trim();
        let valid = true;
        const setErr = (fid, cond) => { document.getElementById(fid).classList.toggle('has-error', cond); if(cond) valid=false; };
        setErr('f_name', !name); setErr('f_dob', !dob);
        setErr('f_contact', !(contact && /^[0-9+()\s-]{6,}$/.test(contact)));
        setErr('f_address', !address);
        if(!valid) return;

        const all = DB.patients();
        const idx = all.findIndex(x=>x.id===id);
        all[idx] = {...all[idx], name,dob,contact,address, updatedBy:s.name, updatedAt:new Date().toISOString()};
        DB.savePatients(all);
        DB.log(s.name, 'Edited patient details', id);
        window.location.href = 'patient-detail.html?id=' + id;
      });
    }
  }
</script>
</body>
</html>
