<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient record — MediDownUnder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="js/data.js">
</script>
<script src="js/shell.js">
</script>
<script>  const s = requireAuth();
  if(s){
    const id = qs('id');
    const p = DB.patients().find(x=>x.id===id);

    if(!p){
      renderShell(s, 'search', `
        <div class="card empty-state">
          <div class="ic">&#10068;</div>
          <p><strong>Patient not found</strong></p>
          <p class="hint">This record may have been removed.</p>
          <div style="margin-top:16px;"><a class="btn btn-secondary" href="patients.html">Back to patients</a></div>
        </div>`);
    } else {
      const isRec = s.role === 'receptionist';
      const notes = DB.notes().filter(n=>n.patientId===id).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));

      const editBtn = isRec ? `<a class="btn btn-secondary" href="patient-edit.html?id=${id}">Edit details</a>` : '';

      const clinicianSection = !isRec ? `
        <hr class="divider">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <h2 style="margin:0;">Consultation notes</h2>
          <a class="btn btn-primary" href="note-new.html?id=${id}">Add note</a>
        </div>
        ${notes.length ? notes.map(n=>`
          <div class="note-item">
            <div class="note-meta"><span>${esc(n.clinicianName)}</span><span class="mono">${fmtDate(n.createdAt)}</span></div>
            <div class="note-text">${esc(n.text)}</div>
          </div>`).join('') : `
          <div class="empty-state">
            <div class="ic">&#128221;</div>
            <p><strong>No consultations recorded</strong></p>
            <p class="hint">Add the first consultation note for this patient.</p>
          </div>`}
      ` : '';

      renderShell(s, 'search', `
        <a class="back-link" href="patients.html">&larr; Back to patients</a>
        <div class="card">
          <div class="patient-header">
            <div>
              <h2>${esc(p.name)}</h2>
              <div class="patient-sub mono">${p.id} · DOB ${p.dob}</div>
            </div>
            ${editBtn}
          </div>
          <p class="desc">${esc(p.contact)} · ${esc(p.address)}</p>
          ${clinicianSection}
        </div>`);
    }
  }
</script>
</body>
</html>
