<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register patient — MediDownUnder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div class="toast" id="toast"></div>

    <script src="js/data.js"></script>
    <script src="js/shell.js"></script>
    <script>
      const s = requireAuth('receptionist')
      if (s) {
        renderShell(
          s,
          'register',
          `
      <a class="back-link" href="patients.html">&larr; Back to patients</a>
      <div class="card">
        <h2>Register patient</h2>
        <p class="desc">All fields are required.</p>
        <div class="alert alert-warning" id="dupWarning">
          A patient with this name and date of birth already exists. Check before creating a duplicate record.
          <div style="margin-top:8px;"><button class="btn btn-secondary" id="dupProceed" type="button">Save anyway</button></div>
        </div>
        <form id="regForm" novalidate>
          <div class="field-grid">
            <div class="field" id="f_name"><label>Full name</label><input id="p_name"><div class="field-error">Enter the patient's full name.</div></div>
            <div class="field" id="f_dob"><label>Date of birth</label><input id="p_dob" type="date"><div class="field-error">Enter a date of birth.</div></div>
            <div class="field" id="f_contact"><label>Contact number</label><input id="p_contact" placeholder="04xx xxx xxx"><div class="field-error">Enter a valid contact number.</div></div>
            <div class="field" id="f_address"><label>Address</label><input id="p_address"><div class="field-error">Enter an address.</div></div>
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top:6px;">Save patient</button>
        </form>
      </div>`,
        )

        let pendingDuplicate = null

        document.getElementById('regForm').addEventListener('submit', (e) => {
          e.preventDefault()
          const name = document.getElementById('p_name').value.trim()
          const dob = document.getElementById('p_dob').value
          const contact = document.getElementById('p_contact').value.trim()
          const address = document.getElementById('p_address').value.trim()

          let valid = true
          const setErr = (id, cond) => {
            document.getElementById(id).classList.toggle('has-error', cond)
            if (cond) valid = false
          }
          setErr('f_name', !name)
          setErr('f_dob', !dob)
          setErr(
            'f_contact',
            !(contact && /^(?=.*\d)[0-9+()\s-]{6,}$/.test(contact)),
          )
          setErr('f_address', !address)
          if (!valid) return

          const dupe = DB.patients().find(
            (p) => p.name.toLowerCase() === name.toLowerCase() && p.dob === dob,
          )
          if (dupe && !pendingDuplicate) {
            document.getElementById('dupWarning').classList.add('show')
            pendingDuplicate = { name, dob, contact, address }
            return
          }
          savePatient(name, dob, contact, address)
        })

        document.getElementById('dupProceed').addEventListener('click', () => {
          const { name, dob, contact, address } = pendingDuplicate
          savePatient(name, dob, contact, address)
        })

        function savePatient(name, dob, contact, address) {
          const patients = DB.patients()
          const id = 'P' + String(1000 + patients.length + 1)
          patients.push({
            id,
            name,
            dob,
            contact,
            address,
            createdBy: s.name,
            createdAt: new Date().toISOString(),
          })
          DB.savePatients(patients)
          DB.log(s.name, 'Registered patient', id)
          window.location.href = 'patient-detail.html?id=' + id
        }
      }
    </script>
  </body>
</html>
